<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Thumbnail Renderer</title>
  <style>html,body{margin:0;height:100%;background:#0f0e0c}canvas{display:block}</style>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
    camera.position.set(0, 1.15, 4.8);
    camera.lookAt(0, 0.28, 0);

    const amb = new THREE.HemisphereLight(0xfff0cf, 0x1a120c, 2.3); scene.add(amb);
    const key = new THREE.DirectionalLight(0xffc26b, 3.2); key.position.set(3,5,4); scene.add(key);
    const fill = new THREE.DirectionalLight(0x9cbf73,1.4); fill.position.set(-4,2,-3); scene.add(fill);

    function resize() {
      const w = Math.max(1, window.innerWidth);
      const h = Math.max(1, window.innerHeight);
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    const params = new URLSearchParams(location.search);
    const modelPath = params.get('model') || '/models/avocado-toast.glb';

    const loader = new GLTFLoader();
    loader.load(modelPath, gltf => {
      const m = gltf.scene;
      m.position.y = -0.22;
      scene.add(m);
      window.__THUMB_READY__ = true;
      // small animation then stay
      let rot = 0;
      function loop() {
        rot += 0.01;
        m.rotation.y = rot;
        renderer.render(scene, camera);
        requestAnimationFrame(loop);
      }
      loop();
    }, (xhr) => {}, err => {
      console.error('GLB load failed', err);
      // still render something
      window.__THUMB_READY__ = true;
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
