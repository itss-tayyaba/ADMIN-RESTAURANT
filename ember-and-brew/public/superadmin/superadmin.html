<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Superadmin — Ember & Brew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="superadmin.css">
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="ember-dot"></span>
      <span class="name">Ember <em>&amp;</em> Brew</span>
    </div>
    <p class="sidebar-tagline">Superadmin</p>

    <button class="nav-item active" data-view="overview"><span class="ic">🌐</span> All Branches</button>

    <div class="sidebar-foot">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="userAvatar">S</div>
        <div class="who">
          <span class="n" id="userNameLabel">Superadmin</span>
          <span class="r">Platform-wide access</span>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <div>
        <h1 class="serif" id="pageTitle">All Branches</h1>
        <div class="crumb" id="breadcrumb"></div>
      </div>
      <div class="topbar-right">
        <span class="scope-pill" id="scopePill">Combined — all branches</span>
      </div>
    </header>

    <div class="content" id="content">
      <div class="loading">Loading branches…</div>
    </div>
  </div>

</div>

<script src="superadmin.js"></script>
</body>
</html>
