<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — Ember & Brew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body class="login-body">

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <span class="ember-dot"></span>
        <span class="login-brand-name">Ember <em>&amp;</em> Brew</span>
      </div>
      <p class="login-sub">Sign in to manage orders, menu &amp; the day's service.</p>

      <form id="loginForm" class="login-form">
        <div class="field">
          <span>Login as</span>
          <div class="role-picker" id="rolePicker">
            <button type="button" class="role-btn" data-role="admin"><span class="role-ic">◆</span>Admin</button>
            <button type="button" class="role-btn" data-role="chef"><span class="role-ic">☕</span>Chef</button>
            <button type="button" class="role-btn" data-role="delivery"><span class="role-ic">🛵</span>Delivery</button>
          </div>
        </div>
        <label class="field">
          <span>Username</span>
          <input type="text" id="username" autocomplete="username" required />
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" id="password" autocomplete="current-password" required />
        </label>
        <p id="loginError" class="login-error" hidden></p>
        <button type="submit" class="btn-primary btn-block" id="loginBtn">Sign in</button>
      </form>
    </div>
    <p class="login-foot">Ember &amp; Brew Admin</p>
  </div>
<script>

const form = document.getElementById("loginForm");
const errorEl = document.getElementById("loginError");
const btn = document.getElementById("loginBtn");
const roleButtons = document.querySelectorAll(".role-btn");
let selectedRole = null;

roleButtons.forEach(b => {
  b.addEventListener("click", () => {
    selectedRole = b.dataset.role;
    roleButtons.forEach(x => x.classList.toggle("active", x === b));
    errorEl.hidden = true;
  });
});

// Already logged in
const token = localStorage.getItem("eb_admin_token");
const user = JSON.parse(localStorage.getItem("eb_admin_user") || 'null');

if (token && user) {
  if (user.role === "admin") {
    window.location.href = "/admin";
  } else if (user.role === "chef") {
    window.location.href = "/kitchen";
  } else if (user.role === "delivery") {
    window.location.href = "/delivery";
  } else {
    window.location.href = "/";
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorEl.hidden = true;

  if (!selectedRole) {
    errorEl.hidden = false;
    errorEl.textContent = "Please select a role to log in as.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Signing In...";

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  try {
    const response = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password, role: selectedRole })
    });

    const data = await response.json();
    if (!response.ok) {
      throw new Error(data.message || data.error || 'Login failed');
    }

    // store with the keys expected by the admin and kitchen scripts
    localStorage.setItem("eb_admin_token", data.token);
    localStorage.setItem("eb_admin_user", JSON.stringify(data.user));

    if (data.user.role === "admin") {
      window.location.href = "/admin";
    } else if (data.user.role === "chef") {
      window.location.href = "/kitchen";
    } else if (data.user.role === "delivery") {
      window.location.href = "/delivery";
    } else {
      window.location.href = "/";
    }

  } catch (err) {
    errorEl.hidden = false;
    errorEl.textContent = err.message;
    btn.disabled = false;
    btn.textContent = "Sign In";
  }

});

</script>
</body>
</html>
