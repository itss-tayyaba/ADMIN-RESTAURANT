<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — Ember & Brew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="admin.css">
<style>
.force-pwd-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 14, 12, 0.75);
  backdrop-filter: blur(5px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 16px;
}
.force-pwd-overlay.hidden { display: none; }
.force-pwd-card {
  background: #1D1B18;
  border: 1px solid #38342F;
  border-radius: 16px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  color: #fff;
  overflow: hidden;
}
.force-pwd-head {
  text-align: center;
  padding: 28px 24px 16px;
  border-bottom: 1px solid #2A2723;
}
.force-pwd-badge {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: rgba(196,146,58,0.15);
  color: #C4923A;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  margin-bottom: 12px;
  border: 1px solid rgba(196,146,58,0.3);
}
.force-pwd-head h2 {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  margin: 0 0 8px;
  color: #fff;
}
.force-pwd-head p {
  margin: 0;
  font-size: 12.5px;
  color: #A8A196;
  line-height: 1.5;
}
</style>
</head>
<body class="login-body">

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <span class="ember-dot"></span>
        <span class="login-brand-name">Ember <em>&amp;</em> Brew</span>
      </div>
      <p class="login-sub">Sign in to manage orders, menu &amp; the day's service.</p>

      <form id="loginForm" class="login-form">
        <div class="field">
          <span>Login as</span>
          <div class="role-picker" id="rolePicker">
            <button type="button" class="role-btn" data-role="admin"><span class="role-ic">◆</span>Admin</button>
            <button type="button" class="role-btn" data-role="chef"><span class="role-ic">☕</span>Chef</button>
            <button type="button" class="role-btn" data-role="delivery"><span class="role-ic">🛵</span>Delivery</button>
            <button type="button" class="role-btn" data-role="superadmin"><span class="role-ic">★</span>Super Admin</button>
          </div>
        </div>
        <label class="field">
          <span>Username</span>
          <input type="text" id="username" autocomplete="username" required />
        </label>
        <label class="field" id="tenantField">
          <span>Restaurant code <small>(e.g. spice-hut, or leave blank if unique)</small></span>
          <input type="text" id="tenant" autocomplete="organization" placeholder="e.g. spice-hut (or leave blank)" />
        </label>
        <label class="field">
          <span>Password</span>
          <div class="password-field">
            <input type="password" id="password" autocomplete="current-password" required />
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password" aria-pressed="false">
              <svg id="eyeToggleIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </label>
        <p id="loginError" class="login-error" hidden></p>
        <button type="submit" class="btn-primary btn-block" id="loginBtn">Sign in</button>
      </form>
    </div>
    <p class="login-foot">Ember &amp; Brew Admin</p>
  </div>

  <!-- Forced Password Change Modal for Temporary Credentials -->
  <div class="force-pwd-overlay hidden" id="forceChangePasswordModal">
    <div class="force-pwd-card">
      <div class="force-pwd-head">
        <div class="force-pwd-badge"><i class="fa-solid fa-key"></i></div>
        <h2>Create New Password</h2>
        <p>Your account was issued a temporary password. You must set a permanent personal password before accessing your dashboard.</p>
      </div>
      <form id="forceChangePasswordForm" class="login-form" style="padding: 20px 24px 26px;">
        <label class="field">
          <span>New Password * (Min. 6 characters)</span>
          <input type="password" id="newForcedPassword" required minlength="6" placeholder="Enter new secure password" />
        </label>
        <label class="field" style="margin-top: 12px;">
          <span>Confirm New Password *</span>
          <input type="password" id="confirmForcedPassword" required minlength="6" placeholder="Re-enter new password" />
        </label>
        <p id="forcePwdError" class="login-error" hidden style="margin-top: 12px;"></p>
        <button type="submit" class="btn-primary btn-block" id="forcePwdBtn" style="margin-top: 18px;">
          <i class="fa-solid fa-lock"></i> Save Password &amp; Continue
        </button>
      </form>
    </div>
  </div>

<script>

const passwordInput = document.getElementById("password");
const toggleBtn = document.getElementById("togglePassword");
const eyeToggleIcon = document.getElementById("eyeToggleIcon");

const EYE_OPEN = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle>';
const EYE_OFF = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.9 20.9 0 0 1 5.06-6.06M9.9 4.24A10.6 10.6 0 0 1 12 4c7 0 11 8 11 8a20.9 20.9 0 0 1-3.22 4.53M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';

toggleBtn.addEventListener("click", () => {
  const willShow = passwordInput.type === "password";
  passwordInput.type = willShow ? "text" : "password";
  eyeToggleIcon.innerHTML = willShow ? EYE_OFF : EYE_OPEN;
  toggleBtn.setAttribute("aria-label", willShow ? "Hide password" : "Show password");
  toggleBtn.setAttribute("aria-pressed", String(willShow));
});

const form = document.getElementById("loginForm");
const errorEl = document.getElementById("loginError");
const btn = document.getElementById("loginBtn");
const roleButtons = document.querySelectorAll(".role-btn");
let selectedRole = null;
const tenantField = document.getElementById('tenantField');

// Force Password Modal Elements
const forceChangePasswordModal = document.getElementById('forceChangePasswordModal');
const forceChangePasswordForm = document.getElementById('forceChangePasswordForm');
const newForcedPassword = document.getElementById('newForcedPassword');
const confirmForcedPassword = document.getElementById('confirmForcedPassword');
const forcePwdError = document.getElementById('forcePwdError');
const forcePwdBtn = document.getElementById('forcePwdBtn');

let activeUserToken = null;
let activeUserData = null;

function navigateRole(role) {
  if (role === "superadmin") {
    window.location.href = "/superadmin";
  } else if (role === "admin" || role === "owner") {
    window.location.href = "/admin";
  } else if (role === "chef") {
    window.location.href = "/kitchen";
  } else if (role === "delivery") {
    window.location.href = "/delivery";
  } else {
    window.location.href = "/";
  }
}

function promptForcedPasswordChange(user, token) {
  activeUserData = user;
  activeUserToken = token;
  forceChangePasswordForm.reset();
  forcePwdError.hidden = true;
  forcePwdError.textContent = '';
  forceChangePasswordModal.classList.remove('hidden');
  newForcedPassword.focus();
}

roleButtons.forEach(b => {
  b.addEventListener("click", () => {
    selectedRole = b.dataset.role;
    roleButtons.forEach(x => x.classList.toggle("active", x === b));
    tenantField.hidden = selectedRole === 'superadmin';
    errorEl.hidden = true;
  });
});

// Already logged in
const token = localStorage.getItem("eb_admin_token");
const user = JSON.parse(localStorage.getItem("eb_admin_user") || 'null');

if (token && user) {
  if (user.mustChangePassword) {
    promptForcedPasswordChange(user, token);
  } else {
    navigateRole(user.role);
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorEl.hidden = true;

  if (!selectedRole) {
    errorEl.hidden = false;
    errorEl.textContent = "Please select a role to log in as.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Signing In...";

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  let tenant = document.getElementById("tenant").value.trim();
  // Strip leading domain, protocol, /r/ or r/, and trailing slashes if entered
  tenant = tenant.replace(/^(?:https?:\/\/[^\/]+)?\/?(?:r\/)?/, '').replace(/\/+$/, '').trim();

  try {
    const response = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password, role: selectedRole, tenant })
    });

    const data = await response.json();
    if (!response.ok) {
      throw new Error(data.message || data.error || 'Login failed');
    }

    // Store credentials
    localStorage.setItem("eb_admin_token", data.token);
    localStorage.setItem("eb_admin_user", JSON.stringify(data.user));

    // Intercept if temporary password must be changed
    if (data.user.mustChangePassword) {
      btn.disabled = false;
      btn.textContent = "Sign in";
      promptForcedPasswordChange(data.user, data.token);
      return;
    }

    navigateRole(data.user.role);

  } catch (err) {
    errorEl.hidden = false;
    errorEl.textContent = err.message;
    btn.disabled = false;
    btn.textContent = "Sign in";
  }
});

// Handle Forced Password Change Submission
if (forceChangePasswordForm) {
  forceChangePasswordForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    forcePwdError.hidden = true;
    forcePwdError.textContent = '';

    const newPwd = newForcedPassword.value;
    const confirmPwd = confirmForcedPassword.value;

    if (!newPwd || newPwd.length < 6) {
      forcePwdError.hidden = false;
      forcePwdError.textContent = 'Password must be at least 6 characters long.';
      return;
    }

    if (newPwd !== confirmPwd) {
      forcePwdError.hidden = false;
      forcePwdError.textContent = 'Passwords do not match.';
      return;
    }

    const currentToken = activeUserToken || localStorage.getItem("eb_admin_token");
    if (!currentToken) {
      forcePwdError.hidden = false;
      forcePwdError.textContent = 'Session expired. Please sign in again.';
      return;
    }

    forcePwdBtn.disabled = true;
    forcePwdBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Updating Password…';

    try {
      const response = await fetch("/api/auth/change-password", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + currentToken
        },
        body: JSON.stringify({ newPassword: newPwd, confirmPassword: confirmPwd })
      });

      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.message || data.error || 'Failed to update password');
      }

      // Update storage with updated user payload (mustChangePassword: false)
      localStorage.setItem("eb_admin_token", data.token);
      localStorage.setItem("eb_admin_user", JSON.stringify(data.user));

      forceChangePasswordModal.classList.add('hidden');
      navigateRole(data.user.role);
    } catch (err) {
      forcePwdError.hidden = false;
      forcePwdError.textContent = err.message;
      forcePwdBtn.disabled = false;
      forcePwdBtn.innerHTML = '<i class="fa-solid fa-lock"></i> Save Password &amp; Continue';
    }
  });
}

</script>
</body>
</html>
