<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#242220"/>
      <stop offset="60%" stop-color="#141311"/>
      <stop offset="100%" stop-color="#0A0908"/>
    </radialGradient>
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="30%" stop-color="#D4A853"/>
      <stop offset="70%" stop-color="#C67D5A"/>
      <stop offset="100%" stop-color="#8A5F2A"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Borders -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldLuxury)" stroke-width="5" opacity="0.85"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#D4A853" stroke-width="2" stroke-dasharray="10 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldLuxury)" stroke-width="1.5" opacity="0.6"/>

  <!-- Glowing Flame & Aroma (Ember) -->
  <path d="M256 95 C235 140, 275 165, 245 205 C230 225, 245 240, 256 250 C267 240, 282 225, 267 205 C237 165, 277 140, 256 95 Z" fill="url(#goldLuxury)" filter="url(#goldGlow)"/>
  
  <!-- Sparkles -->
  <path d="M165 160 Q175 170 185 160 Q175 150 165 160 Z" fill="#FFF8E7"/>
  <path d="M347 160 Q337 170 327 160 Q337 150 347 160 Z" fill="#FFF8E7"/>

  <!-- Artisan Cup (Brew) -->
  <path d="M166 265 C166 360, 346 360, 346 265 Z" fill="url(#goldLuxury)"/>
  <ellipse cx="256" cy="265" rx="90" ry="18" fill="#141311" stroke="url(#goldLuxury)" stroke-width="4"/>
  <ellipse cx="256" cy="265" rx="78" ry="13" fill="url(#goldLuxury)" opacity="0.8"/>

  <!-- Cup Handle -->
  <path d="M336 275 C375 275, 375 325, 336 325" fill="none" stroke="url(#goldLuxury)" stroke-width="10" stroke-linecap="round"/>

  <!-- Saucer -->
  <path d="M135 375 Q256 400 377 375" fill="none" stroke="url(#goldLuxury)" stroke-width="8" stroke-linecap="round"/>

  <!-- Brand Signature -->
  <text x="256" y="440" text-anchor="middle" font-family="'Playfair Display', serif" font-size="34" font-weight="900" fill="#FFF8E7" letter-spacing="4">EMBER &amp; BREW</text>
  <text x="256" y="468" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#D4A853" letter-spacing="6">ARTISAN CUISINE</text>
</svg>