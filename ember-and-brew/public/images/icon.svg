<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1A1917"/>
      <stop offset="100%" stop-color="#0F0E0C"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F0E8"/>
      <stop offset="30%" stop-color="#D4A853"/>
      <stop offset="70%" stop-color="#C67D5A"/>
      <stop offset="100%" stop-color="#9A5638"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#D4A853" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Glowing Emblem -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#D4A853" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Coffee & Flame Silhouette -->
  <!-- Cup Body -->
  <path d="M176 240 C176 320, 336 320, 336 240 Z" fill="url(#goldGrad)"/>
  <!-- Cup Rim -->
  <ellipse cx="256" cy="240" rx="80" ry="16" fill="#1A1917" stroke="#D4A853" stroke-width="4"/>
  <ellipse cx="256" cy="240" rx="70" ry="12" fill="url(#goldGrad)" opacity="0.7"/>
  <!-- Handle -->
  <path d="M328 245 C360 245, 360 290, 328 290" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
  <!-- Saucer -->
  <path d="M150 330 Q256 350 362 330" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Rising Flame/Aroma Steam -->
  <path d="M236 210 C220 180, 250 160, 236 130 C226 110, 246 95, 256 80 C266 95, 286 110, 276 130 C262 160, 292 180, 276 210 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Brand Text -->
  <text x="256" y="415" text-anchor="middle" font-family="'Playfair Display', serif" font-size="34" font-weight="900" fill="#F5F0E8" letter-spacing="4">EMBER &amp; BREW</text>
  <text x="256" y="445" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="14" font-weight="600" fill="#D4A853" letter-spacing="6">ARTISAN CAFÉ</text>
</svg>